<script>

// 🔐 FUNCIÓN PARA ENCRIPTAR EN SHA-256
async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);

    const hashBuffer = await crypto.subtle.digest(
        'SHA-256',
        msgBuffer
    );

    const hashArray = Array.from(
        new Uint8Array(hashBuffer)
    );

    return hashArray
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
}


// 📋 LISTA DE REFERIDOS ENCRIPTADOS
const referidosHashes = [
    "6c30b5e360704d9d907730274d05dd1029f6fd705af21f7640c53f02435d8d8e", 
    "8c002949470a58af56b6969135cc0f5a520d65f41ccf9cbfa7c74cdb238d0b3c", 
    "a11e774d2b63004df88152a22fdaa667103f2e45f2044e67f4bf1500b0e6e0c9", 
    "17da7df2d7f04105f6f77cdff06cddf7076255eff2bf6ad52825444d5c14c18e", 
    "882abd8faba48465158484bfb2916e6a174fe16659a40e0d2e3ce09a913b0440", 
    "1be333cb713ab6996188323ab76847ea44f3eeba7abf8a1bf188fa6cc799e48b", 
    "aa17b400bc7928078a64a14875fe5e0f0823c3f1e89d39660be025ebacd98870", 
    "0fa5467b8fdd9ff16ba20ff5b8e2cbd170323058ee628c1ffc13efb857be2bb6", 
    "7f68ed839699433c7b996d2e23c4b13fbd3a3f69f267727b5f781cbecb2e26b6", 
    "9c0be5d2a67a6ba60e1588a742a5c6a9be02422b8a4574e7e7b3fed216c22a96", 
    "ddcc197556ad1cab933b8bb67409c560839a1abdca334b2750d74f2b23e0a3d4", 
    "e761afb9327901b07211f393135ec37dc5e879d831bfed40355dcf5d57f9095b"
];

// 📦 TUS CÓDIGOS CODIFICADOS EN BASE64
const codigosBase64 = [
    "M1FaM1kxWFc=",
    "RzJGUFpMM00=",
    "SEtMRDFSWks=",
    "Vk0xTkc0OE4=",
    "SkhBTFBONUY=",
    "UzBNQ0FOSDE=",
    "Q1gzSjhGWDU=",
    "VkkzRUpDQTM=",
    "NUpSNk4zTkI=",
    "TDFGR1dLMzM="
];

async function verificarUid() {
    const uidInput = document.getElementById("uid-input").value.trim();
    const alertBox = document.getElementById("result-alert");
    const formBlock = document.getElementById("form-block");

    // Validar UID
    if (!uidInput || !/^\d+$/.test(uidInput)) {
        alertBox.className = "alert error";
        alertBox.style.display = "block";
        alertBox.textContent = "Por favor, ingresa un número de UID válido.";
        return;
    }

    // Generar SHA-256
    const hashUsuario = await sha256(uidInput);

    // Comprobar referido
    if (referidosHashes.includes(hashUsuario)) {
        formBlock.style.display = "none";
        alertBox.className = "alert success";
        alertBox.style.display = "block";

        try {
            if (!codigosBase64 || codigosBase64.length === 0) {
                throw new Error("No hay códigos disponibles");
            }

            // 🎲 Seleccionar un código aleatorio del array encriptado en Base64
            const randomIndex = Math.floor(Math.random() * codigosBase64.length);
            const codigoCodificado = codigosBase64[randomIndex];

            // 🔓 Decodificar el Base64 en caliente solo al mostrarlo
            const codigoFinal = atob(codigoCodificado);

            alertBox.innerHTML = `
                ¡VALIDACIÓN EXITOSA!<br>
                Tu UID figura en la lista de referidos.
                <br>
                <span class="code-box">
                    ${codigoFinal}
                </span>
                <br>
                <button
                    onclick="reiniciarFormulario()"
                    class="btn-link btn-f5"
                >
                    🔄 Consultar otro UID
                </button>
            `;

        } catch (error) {
            console.error(error);
            alertBox.className = "alert error";
            alertBox.innerHTML = "Hubo un error al obtener tu código. Intenta de nuevo más tarde.";
        }

    } else {
        formBlock.style.display = "none";
        alertBox.className = "alert error";
        alertBox.style.display = "block";

        const miLinkReferido = "https://www.binance.com/register?ref=LEEA9DJG";

        alertBox.innerHTML = `
            Tu UID (${uidInput}) no figura como referido activo.
            <br><br>
            Si aún no te has registrado, hazlo desde el siguiente botón:
            <br>
            <a
                href="${miLinkReferido}"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-link"
            >
                Crear Cuenta Referida
            </a>
            <br><br>
            <button
                onclick="reiniciarFormulario()"
                class="btn-link btn-f5"
            >
                🔄 Volver a Chequear
            </button>
            <p class="info-next">
                ⚠️ Si te acabas de registrar y ya pusiste el enlace, estarás habilitado para el próximo stream cuando actualice la lista general.
            </p>
        `;
    }
}

// 🔄 Función para consultar otro UID sin recargar la página entera
function reiniciarFormulario() {
    document.getElementById("form-block").style.display = "block";
    document.getElementById("result-alert").style.display = "none";
    document.getElementById("uid-input").value = "";
    document.getElementById("uid-input").focus();
}

// Permitir presionar ENTER en el UID
document
    .getElementById("uid-input")
    .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            verificarUid();
        }
    });

</script>
